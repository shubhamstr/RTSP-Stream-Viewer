###############################################
# Custom RTSP Video Streamer
# - MediaMTX  : RTSP server + HLS remuxer
# - ffmpeg-*  : Loop public MP4s as RTSP streams
#
# Fix: MediaMTX uses a distroless/scratch image (no shell,
# no wget/nc). Healthcheck removed; FFmpeg containers use
# restart: on-failure so they retry until MediaMTX is ready.
###############################################

services:

  # ─────────────────────────────────────────
  # MediaMTX – RTSP relay server
  # ─────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "9997:9997"   # REST API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - streamer-net

  # ─────────────────────────────────────────
  # Stream 1 – Big Buck Bunny
  # rtsp://localhost:8554/bbb
  # ─────────────────────────────────────────
  ffmpeg-bbb:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-bbb
    # restart: on-failure lets this container retry if mediamtx
    # isn't ready yet when it first starts
    restart: on-failure
    depends_on:
      - mediamtx
    networks:
      - streamer-net
    entrypoint:
      - ffmpeg
      - -re
      - -stream_loop
      - "-1"
      - -i
      - http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -b:v
      - 500k
      - -maxrate
      - 500k
      - -bufsize
      - 1000k
      - -vf
      - scale=854:480
      - -g
      - "30"
      - -c:a
      - aac
      - -b:a
      - 64k
      - -ar
      - "44100"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/bbb

  # ─────────────────────────────────────────
  # Stream 2 – Elephants Dream
  # rtsp://localhost:8554/elephants
  # ─────────────────────────────────────────
  ffmpeg-elephants:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-elephants
    restart: on-failure
    depends_on:
      - mediamtx
    networks:
      - streamer-net
    entrypoint:
      - ffmpeg
      - -re
      - -stream_loop
      - "-1"
      - -i
      - http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -b:v
      - 500k
      - -maxrate
      - 500k
      - -bufsize
      - 1000k
      - -vf
      - scale=854:480
      - -g
      - "30"
      - -c:a
      - aac
      - -b:a
      - 64k
      - -ar
      - "44100"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/elephants

  # ─────────────────────────────────────────
  # Stream 3 – Tears of Steel
  # rtsp://localhost:8554/tears
  # ─────────────────────────────────────────
  ffmpeg-tears:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-tears
    restart: on-failure
    depends_on:
      - mediamtx
    networks:
      - streamer-net
    entrypoint:
      - ffmpeg
      - -re
      - -stream_loop
      - "-1"
      - -i
      - http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -b:v
      - 500k
      - -maxrate
      - 500k
      - -bufsize
      - 1000k
      - -vf
      - scale=854:480
      - -g
      - "30"
      - -c:a
      - aac
      - -b:a
      - 64k
      - -ar
      - "44100"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/tears

networks:
  streamer-net:
    driver: bridge
