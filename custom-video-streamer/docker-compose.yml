###############################################
# Custom RTSP Video Streamer
# - MediaMTX  : RTSP server + HLS remuxer
# - ffmpeg-*  : Loop synthetic video feeds as RTSP streams
###############################################

services:

  # ─────────────────────────────────────────
  # MediaMTX – RTSP relay server
  # ─────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "9997:9997"   # REST API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - streamer-net

  # ─────────────────────────────────────────
  # Stream 1 – Big Buck Bunny Test Pattern
  # rtsp://localhost:8554/bbb
  # ─────────────────────────────────────────
  ffmpeg-bbb:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-bbb
    restart: on-failure
    depends_on:
      - mediamtx
    networks:
      - streamer-net
    entrypoint:
      - ffmpeg
      - -re
      - -f
      - lavfi
      - -i
      - testsrc=size=854x480:rate=25
      - -c:v
      - libx264
      - -pix_fmt
      - yuv420p
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -b:v
      - 800k
      - -g
      - "25"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/bbb

  # ─────────────────────────────────────────
  # Stream 2 – Elephants Dream Test Pattern
  # rtsp://localhost:8554/elephants
  # ─────────────────────────────────────────
  ffmpeg-elephants:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-elephants
    restart: on-failure
    depends_on:
      - mediamtx
    networks:
      - streamer-net
    entrypoint:
      - ffmpeg
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=854x480:rate=25
      - -c:v
      - libx264
      - -pix_fmt
      - yuv420p
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -b:v
      - 800k
      - -g
      - "25"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/elephants

  # ─────────────────────────────────────────
  # Stream 3 – Tears of Steel Test Bars
  # rtsp://localhost:8554/tears
  # ─────────────────────────────────────────
  ffmpeg-tears:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-tears
    restart: on-failure
    depends_on:
      - mediamtx
    networks:
      - streamer-net
    entrypoint:
      - ffmpeg
      - -re
      - -f
      - lavfi
      - -i
      - smptebars=size=854x480:rate=25
      - -c:v
      - libx264
      - -pix_fmt
      - yuv420p
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -b:v
      - 800k
      - -g
      - "25"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/tears

networks:
  streamer-net:
    driver: bridge
