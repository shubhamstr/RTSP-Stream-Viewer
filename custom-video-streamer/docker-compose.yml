version: "3.9"

###############################################
# Custom RTSP Video Streamer
# - MediaMTX  : RTSP server
# - ffmpeg-bbb: loops Big Buck Bunny → RTSP
# - ffmpeg-ele: loops Elephants Dream → RTSP
# - ffmpeg-trs: loops Tears of Steel  → RTSP
###############################################

services:

  # ─────────────────────────────────────────
  # MediaMTX – the RTSP relay/server
  # ─────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS  (browser-friendly fallback)
      - "9997:9997"   # MediaMTX REST API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - streamer-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9997/v3/paths/list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # FFmpeg publisher – Stream 1: Big Buck Bunny
  # rtsp://localhost:8554/bbb
  # ─────────────────────────────────────────
  ffmpeg-bbb:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-bbb
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_healthy
    networks:
      - streamer-net
    entrypoint: >
      ffmpeg
        -re
        -stream_loop -1
        -i http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4
        -c:v libx264
        -preset ultrafast
        -tune zerolatency
        -b:v 500k
        -maxrate 500k
        -bufsize 1000k
        -vf "scale=854:480"
        -g 30
        -c:a aac
        -b:a 64k
        -ar 44100
        -f rtsp
        -rtsp_transport tcp
        rtsp://mediamtx:8554/bbb

  # ─────────────────────────────────────────
  # FFmpeg publisher – Stream 2: Elephants Dream
  # rtsp://localhost:8554/elephants
  # ─────────────────────────────────────────
  ffmpeg-elephants:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-elephants
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_healthy
    networks:
      - streamer-net
    entrypoint: >
      ffmpeg
        -re
        -stream_loop -1
        -i http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4
        -c:v libx264
        -preset ultrafast
        -tune zerolatency
        -b:v 500k
        -maxrate 500k
        -bufsize 1000k
        -vf "scale=854:480"
        -g 30
        -c:a aac
        -b:a 64k
        -ar 44100
        -f rtsp
        -rtsp_transport tcp
        rtsp://mediamtx:8554/elephants

  # ─────────────────────────────────────────
  # FFmpeg publisher – Stream 3: Tears of Steel
  # rtsp://localhost:8554/tears
  # ─────────────────────────────────────────
  ffmpeg-tears:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-tears
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_healthy
    networks:
      - streamer-net
    entrypoint: >
      ffmpeg
        -re
        -stream_loop -1
        -i http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4
        -c:v libx264
        -preset ultrafast
        -tune zerolatency
        -b:v 500k
        -maxrate 500k
        -bufsize 1000k
        -vf "scale=854:480"
        -g 30
        -c:a aac
        -b:a 64k
        -ar 44100
        -f rtsp
        -rtsp_transport tcp
        rtsp://mediamtx:8554/tears

networks:
  streamer-net:
    driver: bridge

