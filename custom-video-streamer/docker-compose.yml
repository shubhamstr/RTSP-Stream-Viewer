###############################################
# Custom RTSP Video Streamer
# - MediaMTX  : RTSP server + HLS remuxer
# - ffmpeg-*  : Loop custom video feeds as RTSP streams
###############################################

services:

  # ─────────────────────────────────────────
  # MediaMTX – RTSP relay server
  # ─────────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "9997:9997"   # REST API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - streamer-net

  # ─────────────────────────────────────────
  # Stream 1 – Earth
  # rtsp://localhost:8554/earth
  # ─────────────────────────────────────────
  ffmpeg-earth:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-earth
    restart: on-failure
    depends_on:
      - mediamtx
    networks:
      - streamer-net
    volumes:
      - ./videos:/videos:ro
    entrypoint:
      - ffmpeg
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/earth.mp4
      - -c:v
      - libx264
      - -pix_fmt
      - yuv420p
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -b:v
      - 1000k
      - -g
      - "25"
      - -c:a
      - aac
      - -b:a
      - 64k
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://publisher:publish_password_123@mediamtx:8554/earth

  # ─────────────────────────────────────────
  # Stream 2 – Road & Trees
  # rtsp://localhost:8554/road_and_trees
  # ─────────────────────────────────────────
  ffmpeg-road-and-trees:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-road-and-trees
    restart: on-failure
    depends_on:
      - mediamtx
    networks:
      - streamer-net
    volumes:
      - ./videos:/videos:ro
    entrypoint:
      - ffmpeg
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/road_and_trees.mp4
      - -c:v
      - libx264
      - -pix_fmt
      - yuv420p
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -b:v
      - 1200k
      - -g
      - "25"
      - -c:a
      - aac
      - -b:a
      - 64k
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://publisher:publish_password_123@mediamtx:8554/road_and_trees

  # ─────────────────────────────────────────
  # Stream 3 – Watering Plant
  # rtsp://localhost:8554/watering_plant
  # ─────────────────────────────────────────
  ffmpeg-watering-plant:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-watering-plant
    restart: on-failure
    depends_on:
      - mediamtx
    networks:
      - streamer-net
    volumes:
      - ./videos:/videos:ro
    entrypoint:
      - ffmpeg
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/watering_plant.mp4
      - -c:v
      - libx264
      - -pix_fmt
      - yuv420p
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -b:v
      - 1000k
      - -g
      - "25"
      - -an
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://publisher:publish_password_123@mediamtx:8554/watering_plant

networks:
  streamer-net:
    driver: bridge
