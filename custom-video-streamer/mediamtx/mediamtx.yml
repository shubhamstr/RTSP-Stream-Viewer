###############################################
# MediaMTX v1.x configuration
# Note: use true/false (not yes/no) for booleans
###############################################

logLevel: info
logDestinations: [stdout]

# REST API
api: true
apiAddress: :9997

# RTSP
rtsp: true
rtspAddress: :8554
rtspEncryption: "no"

# RTMP – disabled
rtmp: false

# HLS – browser-friendly remux
hls: true
hlsAddress: :8888
hlsAlwaysRemux: true
# hlsVariant defaults to "lowLatency" which requires hlsSegmentCount >= 7
# Switch to "fmp4" or bump count to 7
hlsVariant: mpegts
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsSegmentMaxSize: 50MB
hlsAllowOrigins: ["*"]

# WebRTC – disabled
webrtc: false

# SRT – disabled
srt: false

###############################################
# Named paths
###############################################
paths:

  bbb:
    source: publisher

  elephants:
    source: publisher

  tears:
    source: publisher

  "~^.*$":
    source: publisher
