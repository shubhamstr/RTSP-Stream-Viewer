###############################################
# MediaMTX v1.x configuration
###############################################

logLevel: info
logDestinations: [stdout]

###############################################
# Authentication
###############################################

authMethod: internal

authInternalUsers:
  # REST API access
  - user: apiuser
    pass: api_password_123
    ips: []
    permissions:
      - action: api

  # FFmpeg publishing access
  - user: publisher
    pass: publish_password_123
    ips: []
    permissions:
      - action: publish
        path: bbb
      - action: publish
        path: elephants
      - action: publish
        path: tears

  # RTSP/HLS reading access
  - user: viewer
    pass: viewer_password_123
    ips: []
    permissions:
      - action: read
        path: bbb
      - action: read
        path: elephants
      - action: read
        path: tears

###############################################
# REST API
###############################################

api: true
apiAddress: :9997

###############################################
# RTSP
###############################################

rtsp: true
rtspAddress: :8554
rtspEncryption: "no"

###############################################
# RTMP – disabled
###############################################

rtmp: false

###############################################
# HLS
###############################################

hls: true
hlsAddress: :8888
hlsAlwaysRemux: true
hlsVariant: mpegts
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsSegmentMaxSize: 50MB
hlsAllowOrigins: ["*"]

###############################################
# WebRTC – disabled
###############################################

webrtc: false

###############################################
# SRT – disabled
###############################################

srt: false

###############################################
# Named paths
###############################################

paths:
  bbb:
    source: publisher

  elephants:
    source: publisher

  tears:
    source: publisher
