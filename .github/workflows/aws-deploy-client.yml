name: Build and Deploy Client to AWS ECR and EC2

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'client/**'
  #     - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Client Image to ECR
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate client .env file
        run: |
          echo "VITE_API_URL=${{ vars.VITE_API_URL }}" > ./client/.env
          echo "VITE_WS_URL=${{ vars.VITE_WS_URL }}" >> ./client/.env
          echo "Client environment configured."

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_CLIENT || 'rtsp-client' }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_CLIENT || 'rtsp-client' }}:${{ github.sha }}

  deploy:
    name: Deploy Client to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Get ECR login token
        id: ecr-token
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ vars.AWS_REGION || 'us-east-1' }})
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Execute deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_PASSWORD: ${{ steps.ecr-token.outputs.token }}
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          IMAGE_NAME: ${{ vars.ECR_REPOSITORY_CLIENT || 'rtsp-client' }}
          PORT: ${{ vars.CLIENT_PORT || '5001' }}
        with:
          host: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME || secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_PASSWORD,REGISTRY,IMAGE_NAME,PORT
          script: |
            # Authenticate Docker to Amazon ECR on EC2
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin $REGISTRY

            # Pull the latest image
            docker pull $REGISTRY/$IMAGE_NAME:latest

            # Restart container on port 5001
            docker rm -f rtsp-client || true
            docker run -d --name rtsp-client --restart always -p $PORT:5001 $REGISTRY/$IMAGE_NAME:latest

            # Verify container status
            sleep 3
            docker ps --filter "name=rtsp-client"
